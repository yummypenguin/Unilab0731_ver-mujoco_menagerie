# @package _global_
defaults:
  - /task/leap_inhand_ball/mujoco
  - _self_

training:
  task_name: LeapInhandBallGraspAllegro
  sim_backend: mujoco
  no_play: true

algo:
  num_envs: 1024
  # Collection exits after reaching its unique-row target; this is a safety ceiling.
  max_iterations: 1000000

reward:
  scales:
    rotate: 0.0
    obj_linvel: 0.0
    pose_diff: 0.0
    torque: 0.0
    work: 0.0
    drop: 0.0
  # Compatibility field required by RewardConfigPPO. Grasp survival uses each
  # reset proposal's initial_ball_z minus env.termination_drop_distance.
  reset_z_threshold: 0.0

env:
  gen_grasp: true
  reset_source: home
  max_episode_seconds: 2.5
  # One run generates one physical-scale bucket. HORA parity collection commands
  # override both this value and grasp_cache_path explicitly.
  object_scale: 1.0

  grasp_cache_path: robots/leap_hand/caches/ball_grasp_allegro_new_physics_0731_50k.npy
  grasp_collection_target: 50000
  grasp_auto_save: true
  grasp_auto_save_interval: 1000
  grasp_quality_check: true
  grasp_min_contacts: 2
  grasp_max_fingertip_distance: 0.1
  grasp_max_fingertip_surface_gap: 0.005
  termination_drop_distance: 0.005

  grasp_dedup_enabled: true
  grasp_dedup_joint_resolution: 0.001
  grasp_dedup_ball_position_resolution: 0.0005

  grasp_seed_qpos:
    - 1.5152045040427635
    - 0.11430147259750476
    - 0.2876406730815961
    - 0.19280835997306603
    - 1.4188457206477074
    - 0.025681830807677088
    - -0.26717932336688344
    - 0.5369823550831088
    - 1.5294890485315962
    - -0.01798386011739139
    - 0.27558019211759954
    - 0.19821762108233876
    - 1.9245445859343515
    - 0.04788276935232176
    - -0.021885380331691334
    - 0.19524630120127295
    - -0.032440416893199604
    - 0.041151239943936
    - 0.664301098275159
    - 0.9300906819767993
    - 0.07052047191574277
    - -0.04548098804911446
    - 0.3576166467976395

  noise_config:
    level: 0.0
    scale_joint_angle: 0.0

  domain_rand:
    randomize_base_mass: false
    random_com: false
    randomize_gravity: false
    push_robots: false
    joint_noise: 0.25
    ball_vel_noise: 0.0
    ball_z_offset: 0.0
