  reset_source: home
  max_episode_seconds: 3.0

  grasp_cache_path: robots/leap_hand/caches/ball_grasp_allegro_dedup_50k.npy
  grasp_collection_target: 50000
  grasp_auto_save: true
  grasp_quality_check: true
  grasp_min_contacts: 2
  grasp_max_fingertip_distance: 0.1061

  grasp_dedup_enabled: true
  grasp_dedup_joint_resolution: 0.01
