# @package _global_
training:
  task_name: LeapInhandBallStateCycleRotation
  sim_backend: mujoco
  render_spacing: 0.5
  cam_distance: 1.2
  cam_lookat: [0.0, 0.0, 0.5]
  cam_elevation: -20.0

algo:
  num_envs: 4096
  num_steps_per_env: 8
  max_iterations: 1000
  save_interval: 25
  obs_groups:
    actor: [policy]
    critic: [policy]
  actor:
    class_name: rsl_rl.models.MLPModel
    hidden_dims: [512, 256, 128]
    activation: elu
    obs_normalization: true
    distribution_cfg:
      class_name: rsl_rl.modules.distribution.GaussianDistribution
      init_std: 0.3
      std_type: scalar
  critic:
    class_name: rsl_rl.models.MLPModel
    hidden_dims: [512, 256, 128]
    activation: elu
    obs_normalization: true
  algorithm:
    value_loss_coef: 4.0
    entropy_coef: 0.0
    desired_kl: 0.02

reward:
  pose_progress_scale: 4.0
  pose_tracking_scale: 0.25
  pose_sigma: 0.08
  rotation_progress_scale: 3.0
  reverse_rotation_scale: 4.0
  position_error_scale: 6.0
  object_linvel_scale: 0.3
  transition_success_bonus: 0.25
  cycle_success_bonus: 0.75
  timeout_penalty: 0.25
  failure_penalty: 1.0

env:
  sim_dt: 0.005
  ctrl_dt: 0.05
  max_episode_seconds: 30.0
  rotation_axis: [0.0, 0.0, 1.0]
  joint_velocity_scale: 0.20
  termination_workspace_radius: 0.05
  noise_config:
    level: 0.0
    scale_joint_angle: 0.02
  control_config:
    action_scale: 0.041666666666666664
    kp: 3.0
    kd: 0.1
  domain_rand:
    randomize_base_mass: false
    random_com: false
    randomize_gravity: false
    push_robots: false
    joint_noise: 0.0
    ball_vel_noise: 0.0
    ball_z_offset: 0.0
  state_cycle:
    reset_pose_weights: [1.0, 1.0, 1.0]
    ready_to_a:
      target_pose: A
      timeout_seconds: 1.5
      pose_tolerance: 0.08
      position_tolerance_m: 0.020
      max_ball_speed_m_s: 0.10
      minimum_contacts: 2
      minimum_net_angle_rad: 0.0
      hold_steps: 4
    a_to_b:
      target_pose: B
      timeout_seconds: 2.0
      pose_tolerance: 0.08
      position_tolerance_m: 0.020
      max_ball_speed_m_s: 0.10
      minimum_contacts: 2
      minimum_net_angle_rad: 0.03
      hold_steps: 4
    b_to_ready:
      target_pose: ready
      timeout_seconds: 1.3
      pose_tolerance: 0.08
      position_tolerance_m: 0.020
      max_ball_speed_m_s: 0.10
      minimum_contacts: 2
      minimum_net_angle_rad: 0.0
      hold_steps: 4

play_profile:
  enabled: true
  env:
    render_spacing: 2.0

interactive:
  show_object_rotation: true
  rotation_body_name: leap_object

