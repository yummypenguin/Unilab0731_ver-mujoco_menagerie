# @package _global_
training:
  task_name: LeapInhandBall0730Rotation
  sim_backend: mujoco
  render_spacing: 0.5
  cam_distance: 1.2
  cam_lookat: [0.0, 0.0, 0.5]
  cam_elevation: -20.0

algo:
  # Short diagnostic budget; expand only after metrics and viewer agree.
  num_envs: 2048
  num_steps_per_env: 8
  max_iterations: 300
  save_interval: 25
  obs_groups:
    actor: [policy]
    critic: [policy]
  actor:
    class_name: rsl_rl.models.MLPModel
    hidden_dims: [512, 256, 128]
    activation: elu
    obs_normalization: true
    distribution_cfg:
      class_name: rsl_rl.modules.distribution.GaussianDistribution
      init_std: 1.0
      std_type: scalar
  critic:
    class_name: rsl_rl.models.MLPModel
    hidden_dims: [512, 256, 128]
    activation: elu
    obs_normalization: true
  algorithm:
    value_loss_coef: 4.0
    desired_kl: 0.02

reward:
  scales:
    rotate: 1.25
    obj_linvel: -0.3
    pose_diff: -0.3
    torque: -0.1
    work: -2.0
    # Pre-ctrl_dt terminal penalty. The value logged as reward/drop is -10.0;
    # the contribution returned to PPO is -10.0 * ctrl_dt = -0.5.
    drop: -10.0
  angvel_clip_min: -0.5
  angvel_clip_max: 0.5
  # Compatibility field required by RewardConfigPPO. This task terminates from
  # each cache row's initial_ball_z minus env.termination_drop_distance.
  reset_z_threshold: 0.0

env:
  sim_dt: 0.005
  ctrl_dt: 0.05
  max_episode_seconds: 20.0
  gen_grasp: false
  grasp_cache_path: robots/leap_hand/caches/ball_grasp_allegro_new_physics_0731_50k.npy
  termination_drop_distance: 0.005
  noise_config:
    level: 0.0
    scale_joint_angle: 0.0
  control_config:
    action_scale: 0.041666666666666664
  domain_rand:
    randomize_base_mass: false
    random_com: false
    randomize_gravity: false
    push_robots: false
    joint_noise: 0.0
    ball_vel_noise: 0.0
    ball_z_offset: 0.0

play_profile:
  enabled: true
  env:
    render_spacing: 2.0

interactive:
  show_object_rotation: true
  rotation_body_name: leap_object
