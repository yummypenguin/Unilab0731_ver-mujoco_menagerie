# @package _global_
defaults:
  - /task/leap_inhand_ball_0730/mujoco
  - _self_

training:
  task_name: LeapInhandBall0730HoraRotation

interactive:
  action_mode: policy
  policy_obs_mode: actor

algo:
  algo_log_name: hora_ppo
  runtime_impl: hora_ppo
  runtime_resolver: unilab.algos.torch.hora.rsl_rl:resolve_hora_ppo_runtime
  obs_groups:
    actor: [actor]
    critic: [actor]
  actor:
    class_name: unilab.algos.torch.hora:HoraActorModel
    hidden_dims: [512, 256, 128]
    activation: elu
    obs_normalization: true
    priv_info_embed_dim: 9
    priv_mlp_hidden_dims: [256, 128, 9]
    distribution_cfg:
      class_name: GaussianDistribution
      init_std: 1.0
      std_type: scalar
  critic:
    class_name: unilab.algos.torch.hora:HoraCriticModel
    hidden_dims: [512, 256, 128]
    activation: elu
    obs_normalization: true
    priv_info_embed_dim: 9
    priv_mlp_hidden_dims: [256, 128, 9]
  algorithm:
    class_name: unilab.algos.torch.hora:HoraPPO

env:
  actor_history_len: 3
  proprio_history_len: 30
  critic_info_dim: 9
  rotation_axis_command: [0.0, 0.0, 1.0]
  hora_domain_rand:
    enabled: true
    randomize_object_mass: true
    object_mass_ratio_lower: 0.90
    object_mass_ratio_upper: 1.10
    randomize_object_friction: true
    object_friction_scale_lower: 0.80
    object_friction_scale_upper: 1.20
    randomize_object_com: true
    object_com_offset_lower: [-0.001, -0.001, -0.001]
    object_com_offset_upper: [0.001, 0.001, 0.001]
    randomize_gravity_direction: true
    gravity_tilt_max_deg: 3.0
    joint_measurement_noise_rad: 0.003
    action_delay_min_steps: 0
    action_delay_max_steps: 1
